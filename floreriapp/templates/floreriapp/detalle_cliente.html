<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Cliente</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fcfbfa;
            color: #2c3531;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-detalle {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.05);
            width: 100%;
            max-width: 450px;
            border-top: 4px solid #4a6b5d;
            border-bottom: 1px solid #f0ebe5;
            display: none;
        }

        h1 {
            color: #3b5249;
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .fila-detalle {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0ebe5;
        }

        .fila-detalle:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .etiqueta {
            font-family: 'Segoe UI', sans-serif;
            font-size: 12px;
            color: #8c9b92;
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .valor {
            font-size: 15px;
            color: #2c3531;
            font-weight: 500;
            word-break: break-word;
        }

        .acciones {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        a.btn-editar {
            display: block;
            width: 100%;
            background-color: #4a6b5d;
            color: #ffffff;
            text-align: center;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        a.btn-editar:hover {
            background-color: #3b5249;
        }

        a.btn-editar:active {
            transform: scale(0.99);
        }

        a.btn-volver {
            display: block;
            text-align: center;
            color: #6b7c72;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        a.btn-volver:hover {
            color: #3b5249;
            text-decoration: underline;
        }

        #mensaje-carga {
            font-size: 15px;
            color: #6b7c72;
            text-align: center;
            margin-top: 50px;
            font-family: 'Segoe UI', sans-serif;
        }

        #mensaje-error {
            display: none;
            background-color: #fdf2f2;
            color: #9b4a4a;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            max-width: 450px;
            width: 100%;
            border: 1px solid #f8d7d7;
        }
    </style>
</head>
<body>

    <div id="mensaje-carga">Cargando información del cliente...</div>
    <div id="mensaje-error">No se pudo cargar la información. Verifique su conexión.</div>

    <div class="contenedor-detalle" id="contenedor-detalle">
        <h1 id="titulo-cliente">Cargando...</h1>

        <div class="fila-detalle">
            <span class="etiqueta">ID de Cliente</span>
            <span class="valor" id="val-id"></span>
        </div>

        <div class="fila-detalle">
            <span class="etiqueta">Correo Electrónico</span>
            <span class="valor" id="val-email"></span>
        </div>

        <div class="fila-detalle">
            <span class="etiqueta">Teléfono</span>
            <span class="valor" id="val-telefono"></span>
        </div>

        <div class="fila-detalle">
            <span class="etiqueta">Dirección</span>
            <span class="valor" id="val-direccion"></span>
        </div>

        <div class="acciones">
            <a href="{% url 'editar_cliente' cliente.id %}" class="btn-editar">Editar este cliente</a>
            <a href="{% url 'listar_clientes' %}" class="btn-volver">Volver a la lista de clientes</a>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('token');
        const clienteId = "{{ cliente.id }}";

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDatosCliente() {
            try {
                const respuesta = await fetch(`/api/clientes/${clienteId}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    
                    document.getElementById('titulo-cliente').textContent = 'Cliente: ' + datos.nombre;
                    document.getElementById('val-id').textContent = datos.id;
                    document.getElementById('val-email').textContent = datos.email;
                    document.getElementById('val-telefono').textContent = datos.telefono;
                    document.getElementById('val-direccion').textContent = datos.direccion;

                    document.getElementById('mensaje-carga').style.display = 'none';
                    document.getElementById('contenedor-detalle').style.display = 'block';
                } else {
                    document.getElementById('mensaje-carga').style.display = 'none';
                    document.getElementById('mensaje-error').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('mensaje-carga').style.display = 'none';
                document.getElementById('mensaje-error').style.display = 'block';
            }
        }

        cargarDatosCliente();
    </script>
</body>
</html>
