<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Detalles de Pedido - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fcfbfa;
            color: #2c3531;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.05);
            border-top: 5px solid #4a6b5d;
            border-bottom: 1px solid #f0ebe5;
        }

        h1 {
            color: #3b5249;
            margin-bottom: 25px;
            font-size: 26px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-crear {
            display: inline-block;
            background-color: #4a6b5d;
            color: #ffffff;
            padding: 11px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-crear:hover {
            background-color: #3b5249;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
        }

        th {
            background-color: #f4efe9;
            color: #4a6b5d;
            text-align: left;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e8e2d9;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0ebe5;
            color: #2c3531;
        }

        tr:nth-child(even) {
            background-color: #faf9f7;
        }

        tr:hover {
            background-color: #f4efe9;
        }

        .acciones-cell a {
            color: #a34848;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .acciones-cell a:hover {
            color: #8b3a3a;
            text-decoration: underline;
        }

        .volver-link {
            color: #6b7c72;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            display: inline-block;
            transition: color 0.2s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .volver-link:hover {
            color: #3b5249;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todos los Detalles de Pedidos</h1>

        <a href="{% url 'crear_detalle' %}" class="btn-crear"> + Agregar ítem a pedido</a>

        <table>
            <thead>
                <tr>
                    <th>ID Detalle</th>
                    <th>ID Pedido</th>
                    <th>Cliente</th>
                    <th>Flor</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-detalles-body">
                <tr>
                    <td colspan="7" style="text-align: center; color: #777;">Cargando detalles de pedidos...</td>
                </tr>
            </tbody>
        </table>

        <a href="{% url 'inicio' %}" class="volver-link">Volver al inicio</a>
    </div>

    <script>
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDetalles() {
            const tbody = document.getElementById('tabla-detalles-body');
            const urlEliminarBase = "{% url 'eliminar_detalle' 0 %}";

            try {
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': 'Token ' + token
                };

                const [respDetalles, respPedidos, respClientes] = await Promise.all([
                    fetch('/api/detalles/', { headers }),
                    fetch('/api/pedidos/', { headers }).catch(() => null),
                    fetch('/api/clientes/', { headers }).catch(() => null)
                ]);

                if (respDetalles.ok) {
                    const detalles = await respDetalles.json();

                    let mapaPedidos = {};
                    let mapaClientes = {};

                    if (respPedidos && respPedidos.ok) {
                        const pedidos = await respPedidos.json();
                        pedidos.forEach(p => mapaPedidos[p.id] = p.cliente_id);
                    }

                    if (respClientes && respClientes.ok) {
                        const clientes = await respClientes.json();
                        clientes.forEach(c => mapaClientes[c.id] = c.nombre);
                    }

                    tbody.innerHTML = '';

                    if (detalles.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #777;">No hay detalles registrados.</td></tr>';
                    } else {
                        detalles.forEach(detalle => {
                            const tr = document.createElement('tr');
                            const urlEliminar = urlEliminarBase.replace('0', detalle.id);

                            const clienteId = mapaPedidos[detalle.pedido_id];
                            const nombreCliente = mapaClientes[clienteId] || 'N/A';
                            const nombreFlor = detalle.flor_nombre || `Flor #${detalle.flor_id}`;

                            tr.innerHTML = `
                                <td>${detalle.id}</td>
                                <td><strong>#${detalle.pedido_id}</strong></td>
                                <td>${nombreCliente}</td>
                                <td>${nombreFlor}</td>
                                <td>${detalle.cantidad}</td>
                                <td>$${detalle.precio_unitario}</td>
                                <td class="acciones-cell">
                                    <a href="${urlEliminar}">Eliminar</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error al cargar la lista de detalles.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error de conexión con el servidor.</td></tr>';
            }
        }

        cargarDetalles();
    </script>
</body>
</html>
