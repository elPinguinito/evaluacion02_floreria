<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Detalles de Pedido - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #2e7d32;
        }

        h1 {
            color: #2c5e3b;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
        }

        .btn-crear {
            display: inline-block;
            background-color: #2e7d32;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-crear:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
        }

        th {
            background-color: #2e7d32;
            color: white;
            text-align: left;
            padding: 12px;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #444;
        }

        tr:nth-child(even) {
            background-color: #f9fbf9;
        }

        tr:hover {
            background-color: #f1f8e9;
        }

        .acciones-cell a {
            color: #c62828;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .acciones-cell a:hover {
            color: #b71c1c;
            text-decoration: underline;
        }

        .volver-link {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            transition: color 0.2s ease;
        }

        .volver-link:hover {
            color: #1b5e20;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todos los Detalles de Pedidos</h1>

        <a href="{% url 'crear_detalle' %}" class="btn-crear"> + Agregar ítem a pedido</a>

        <table>
            <thead>
                <tr>
                    <th>ID Detalle</th>
                    <th>ID Pedido</th>
                    <th>Cliente</th>
                    <th>Flor</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-detalles-body">
                <tr>
                    <td colspan="7" style="text-align: center; color: #777;">Cargando detalles de pedidos...</td>
                </tr>
            </tbody>
        </table>

        <a href="{% url 'inicio' %}" class="volver-link">Volver al inicio</a>
    </div>

    <script>
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDetalles() {
            const tbody = document.getElementById('tabla-detalles-body');
            const urlEliminarBase = "{% url 'eliminar_detalle' 0 %}";

            try {
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': 'Token ' + token
                };

                const [respDetalles, respPedidos, respClientes] = await Promise.all([
                    fetch('/api/detalles/', { headers }),
                    fetch('/api/pedidos/', { headers }).catch(() => null),
                    fetch('/api/clientes/', { headers }).catch(() => null)
                ]);

                if (respDetalles.ok) {
                    const detalles = await respDetalles.json();

                    let mapaPedidos = {};
                    let mapaClientes = {};

                    if (respPedidos && respPedidos.ok) {
                        const pedidos = await respPedidos.json();
                        pedidos.forEach(p => mapaPedidos[p.id] = p.cliente_id);
                    }

                    if (respClientes && respClientes.ok) {
                        const clientes = await respClientes.json();
                        clientes.forEach(c => mapaClientes[c.id] = c.nombre);
                    }

                    tbody.innerHTML = '';

                    if (detalles.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #777;">No hay detalles registrados.</td></tr>';
                    } else {
                        detalles.forEach(detalle => {
                            const tr = document.createElement('tr');
                            const urlEliminar = urlEliminarBase.replace('0', detalle.id);

                            const clienteId = mapaPedidos[detalle.pedido_id];
                            const nombreCliente = mapaClientes[clienteId] || 'N/A';
                            const nombreFlor = detalle.flor_nombre || `Flor #${detalle.flor_id}`;

                            tr.innerHTML = `
                                <td>${detalle.id}</td>
                                <td><strong>#${detalle.pedido_id}</strong></td>
                                <td>${nombreCliente}</td>
                                <td>${nombreFlor}</td>
                                <td>${detalle.cantidad}</td>
                                <td>$${detalle.precio_unitario}</td>
                                <td class="acciones-cell">
                                    <a href="${urlEliminar}">Eliminar</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error al cargar la lista de detalles.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error de conexión con el servidor.</td></tr>';
            }
        }

        cargarDetalles();
    </script>
</body>
</html>
