<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Flores - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fcfbfa;
            color: #2c3531;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.05);
            border-top: 5px solid #4a6b5d;
            border-bottom: 1px solid #f0ebe5;
        }

        h1 {
            color: #3b5249;
            margin-bottom: 25px;
            font-size: 26px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-crear {
            display: inline-block;
            background-color: #4a6b5d;
            color: #ffffff;
            padding: 11px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 25px;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-crear:hover {
            background-color: #3b5249;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
            font-family: 'Segoe UI', sans-serif;
        }

        th {
            background-color: #f4efe9;
            color: #4a6b5d;
            text-align: left;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e8e2d9;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0ebe5;
            color: #2c3531;
        }

        tr:nth-child(even) {
            background-color: #faf9f7;
        }

        tr:hover {
            background-color: #f4efe9;
        }

        .acciones-cell a {
            color: #4a6b5d;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin: 0 4px;
            transition: color 0.2s ease;
        }

        .acciones-cell a:hover {
            color: #2c3531;
            text-decoration: underline;
        }

        .acciones-cell a.eliminar {
            color: #a34848;
        }

        .acciones-cell a.eliminar:hover {
            color: #8b3a3a;
        }

        .volver-link {
            color: #6b7c72;
            text-decoration: none;
            font-weight: 500;
            font-size: 13px;
            display: inline-block;
            transition: color 0.2s ease;
            font-family: 'Segoe UI', sans-serif;
        }

        .volver-link:hover {
            color: #3b5249;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Catálogo de Flores</h1>

        <a href="{% url 'crear_flor' %}" class="btn-crear"> + Agregar nueva flor</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Color</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Disponible</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-flores-body">
                <tr>
                    <td colspan="7" style="text-align: center; color: #777;">Cargando catálogo de flores...</td>
                </tr>
            </tbody>
        </table>

        <a href="{% url 'inicio' %}" class="volver-link">Volver al inicio</a>
    </div>

    <script>
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarFlores() {
            const tbody = document.getElementById('tabla-flores-body');
            const urlDetalleBase = "{% url 'detalle_flor' 0 %}";
            const urlEditarBase = "{% url 'editar_flor' 0 %}";
            const urlEliminarBase = "{% url 'eliminar_flor' 0 %}";

            try {
                const respuesta = await fetch('/api/flores/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    const flores = await respuesta.json();
                    tbody.innerHTML = '';

                    if (flores.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #777;">No hay flores registradas.</td></tr>';
                    } else {
                        flores.forEach(flor => {
                            const tr = document.createElement('tr');

                            const urlDetalle = urlDetalleBase.replace('0', flor.id);
                            const urlEditar = urlEditarBase.replace('0', flor.id);
                            const urlEliminar = urlEliminarBase.replace('0', flor.id);

                            tr.innerHTML = `
                                <td>${flor.id}</td>
                                <td><strong>${flor.nombre}</strong></td>
                                <td>${flor.color}</td>
                                <td>$${flor.precio}</td>
                                <td>${flor.stock}</td>
                                <td>${flor.disponible ? 'Sí' : 'No'}</td>
                                <td class="acciones-cell">
                                    <a href="${urlDetalle}">Ver</a> |
                                    <a href="${urlEditar}">Editar</a> |
                                    <a href="${urlEliminar}" class="eliminar">Eliminar</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error al cargar la lista de flores.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error de conexión con el servidor.</td></tr>';
            }
        }

        cargarFlores();
    </script>
</body>
</html>
