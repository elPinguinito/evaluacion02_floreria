<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Florería</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Georgia', 'Segoe UI', serif;
            color: #2c3531;

            background: linear-gradient(
                135deg,
                #fcfbfa 0%,
                #f4efe9 50%,
                #e8efe9 100%
            );
        }

        .contenedor-login {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background-color: #ffffff;
            border: 1px solid #f0ebe5;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.06);
            position: relative;
            border-top: 5px solid #4a6b5d; 
        }

        h1 {
            margin-bottom: 10px;
            color: #3b5249;
            font-size: 28px;
            text-align: center;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .subtitulo {
            margin-bottom: 25px;
            color: #7b8c83;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            margin-top: 6px;
            color: #5a6b62;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #2c3531;
            background-color: #faf9f7;
            border: 1px solid #dcd6cd;
            border-radius: 6px;
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #aab7b8;
        }

        input:hover {
            border-color: #b0c2b7;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #4a6b5d;
            box-shadow: 0 0 0 3px rgba(74, 107, 93, 0.12);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background-color: #4a6b5d;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: #3b5249;
            box-shadow: 0 6px 15px rgba(74, 107, 93, 0.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid #b0c2b7;
            outline-offset: 3px;
        }

        #mensaje {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            overflow-wrap: anywhere;
            font-family: 'Segoe UI', sans-serif;
        }

        #mensaje:empty {
            display: none;
        }

        #mensaje.exito {
            color: #1b5e20;
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
        }

        #mensaje.error {
            color: #a34848;
            background-color: #fdf2f2;
            border: 1px solid #f8d7d7;
        }

        @media (max-width: 480px) {
            .contenedor-login {
                padding: 30px 22px;
                border-radius: 12px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor-login">

        <h1>Florería</h1>

        <p class="subtitulo">
            Ingresa tus credenciales para administrar la tienda.
        </p>

        <form id="formLogin">

            <label for="username">Usuario:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit">Ingresar</button>

        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

    </div>

    <script>
        const formulario = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            mensaje.textContent = '';
            mensaje.className = '';

            try {
                const respuesta = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    sessionStorage.setItem('token', datos.token);

                    mensaje.textContent = 'Inicio de sesión correcto. Entrando al panel...';
                    mensaje.className = 'exito';

                    setTimeout(() => {
                        window.location.href = '/panel/';
                    }, 1000);
                } else {
                    mensaje.textContent =
                        datos.error || 'Error al iniciar sesión';

                    mensaje.className = 'error';
                }

            } catch (error) {
                mensaje.textContent =
                    'No se pudo conectar con el servidor. Intenta nuevamente.';

                mensaje.className = 'error';
            }
        });
    </script>
</body>
</html>
