<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Florería</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #2c3e50;

            background: linear-gradient(
                135deg,
                #fcf6f7 0%,
                #f0f5f1 50%,
                #e5efe8 100%
            );
        }

        .contenedor-login {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background-color: #ffffff;
            border: 1px solid rgba(200, 220, 205, 0.5);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(50, 90, 70, 0.1);
            position: relative;
            border-top: 6px solid #3b6e54; 
        }

        h1 {
            margin-bottom: 10px;
            color: #3b6e54;
            font-size: 28px;
            text-align: center;
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .subtitulo {
            margin-bottom: 25px;
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 8px;
            color: #34495e;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            font-family: inherit;
            font-size: 15px;
            color: #2c3e50;
            background-color: #fafbfc;
            border: 1px solid #d5dde0;
            border-radius: 10px;
            outline: none;

            transition: border-color 0.2s,
                        box-shadow 0.2s,
                        background-color 0.2s;
        }

        input::placeholder {
            color: #aab7b8;
        }

        input:hover {
            border-color: #a3c1ad;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #3b6e54;
            box-shadow: 0 0 0 4px rgba(59, 110, 84, 0.12);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #3b6e54, #2a523d);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        button:hover {
            background: linear-gradient(135deg, #2a523d, #1e3b2c);
            box-shadow: 0 8px 18px rgba(59, 110, 84, 0.25);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid #a3c1ad;
            outline-offset: 3px;
        }

        #mensaje {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        #mensaje:empty {
            display: none;
        }

        #mensaje.exito {
            color: #1e4620;
            background-color: #eaf4eb;
            border: 1px solid #c8e6c9;
        }

        #mensaje.error {
            color: #9c2727;
            background-color: #fde8e8;
            border: 1px solid #f5c2c2;
        }

        @media (max-width: 480px) {
            .contenedor-login {
                padding: 30px 22px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor-login">

        <h1>Florería</h1>

        <p class="subtitulo">
            Ingresa tus credenciales para administrar la tienda.
        </p>

        <form id="formLogin">

            <label for="username">Usuario:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit">Ingresar</button>

        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

    </div>

    <script>
        const formulario = document.getElementById('formLogin');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            mensaje.textContent = '';
            mensaje.className = '';

            try {
                const respuesta = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    sessionStorage.setItem('token', datos.token);

                    mensaje.textContent = 'Inicio de sesión correcto. Entrando al panel...';
                    mensaje.className = 'exito';

                    setTimeout(() => {
                        window.location.href = '/panel/';
                    }, 1000);
                } else {
                    mensaje.textContent =
                        datos.error || 'Error al iniciar sesión';

                    mensaje.className = 'error';
                }

            } catch (error) {
                mensaje.textContent =
                    'No se pudo conectar con el servidor. Intenta nuevamente.';

                mensaje.className = 'error';
            }
        });
    </script>
</body>
</html>
