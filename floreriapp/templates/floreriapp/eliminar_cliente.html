<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Cliente</title>
</head>
<body>
    <h1>¿Estás seguro de eliminar a este cliente?</h1>
    <p>Vas a eliminar a <strong>{{ cliente.nombre }}</strong>.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Sí, eliminar definitivamente</button>
    </form>

    <br>
    <a href="{% url 'listar_clientes' %}">Cancelar y volver</a>
</body>
</html>
