<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Flor - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #c62828;
            margin-bottom: 15px;
            font-size: 24px;
            text-align: center;
        }

        .card-eliminar {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            border-top: 5px solid #c62828;
            text-align: center;
        }

        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 25px;
        }

        strong {
            color: #2c5e3b;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #c62828;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background-color: #b71c1c;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        a {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            margin-top: 15px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #2e7d32;
            text-decoration: underline;
        }

        #mensaje {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card-eliminar">
        <h1>¿Estás seguro de eliminar esta flor?</h1>
        <p>Vas a eliminar <strong id="nombre-flor">{{ flor.nombre }}</strong> de la base de datos.</p>

        <form id="formEliminarFlor">
            <button type="submit">Sí, eliminar definitivamente</button>
        </form>

        <p id="mensaje"></p>

        <a href="{% url 'listar_flores' %}">Cancelar y volver</a>
    </div>

    <script>
        const formulario = document.getElementById('formEliminarFlor');
        const mensaje = document.getElementById('mensaje');
        const token = sessionStorage.getItem('token');
        const florId = "{{ flor.id }}";

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDatosFlor() {
            try {
                const respuesta = await fetch(`/api/flores/${florId}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    document.getElementById('nombre-flor').textContent = datos.nombre;
                }
            } catch (error) {}
        }

        cargarDatosFlor();

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            mensaje.style.display = 'block';
            mensaje.style.color = '#555';
            mensaje.style.backgroundColor = '#f4f4f4';
            mensaje.textContent = 'Eliminando flor...';

            try {
                const respuesta = await fetch(`/api/flores/${florId}/`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    mensaje.style.color = '#1b5e20';
                    mensaje.style.backgroundColor = '#e8f5e9';
                    mensaje.textContent = 'Flor eliminada correctamente.';
                    
                    setTimeout(() => {
                        window.location.href = "{% url 'listar_flores' %}";
                    }, 1200);
                } else {
                    mensaje.style.color = '#c62828';
                    mensaje.style.backgroundColor = '#ffebee';
                    mensaje.textContent = 'Error al eliminar la flor.';
                }
            } catch (error) {
                mensaje.style.color = '#c62828';
                mensaje.style.backgroundColor = '#ffebee';
                mensaje.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
