<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Flor</title>
</head>
<body>
    <h1>¿Estás seguro de eliminar esta flor?</h1>
    <p>Vas a eliminar <strong>{{ flor.nombre }}</strong> de la base de datos.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Sí, eliminar definitivamente</button>
    </form>

    <br>
    <a href="{% url 'listar_flores' %}">Cancelar y volver</a>
</body>
</html>
