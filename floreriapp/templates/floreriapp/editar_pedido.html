<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Pedido</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c5e3b;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
        }

        form {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border-top: 5px solid #2e7d32;
        }

        label {
            font-weight: 600;
            color: #444;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: #2e7d32;
            outline: none;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }

        button[type="submit"] {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background-color: #1b5e20;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #1b5e20;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Editar Pedido #{{ pedido.id }}</h1>

    <form method="POST">
        {% csrf_token %}

        <label for="cliente">Cliente:</label><br>
        <select id="cliente" name="cliente" required>
            {% for cliente in clientes %}
                <option value="{{ cliente.id }}" {% if cliente.id == pedido.cliente.id %}selected{% endif %}>
                    {{ cliente.nombre }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="fecha_pedido">Fecha de pedido:</label><br>
        <input type="date" id="fecha_pedido" name="fecha_pedido" value="{{ pedido.fecha_pedido|date:'Y-m-d' }}" required>

        <br><br>

        <label for="direccion_entrega">Dirección de entrega:</label><br>
        <input type="text" id="direccion_entrega" name="direccion_entrega" value="{{ pedido.direccion_entrega }}" required>

        <br><br>

        <label for="estado">Estado del pedido:</label><br>
        <select id="estado" name="estado" required>
            {% for valor, etiqueta in estados %}
                <option value="{{ valor }}" {% if valor == pedido.estado %}selected{% endif %}>
                    {{ etiqueta }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="total">Total ($):</label><br>
        <input type="number" id="total" name="total" value="{{ pedido.total }}" min="0" required>

        <br><br>

        <button type="submit">Actualizar pedido</button>
    </form>

    <br>
    <a href="{% url 'listar_pedidos' %}">Volver a la lista de pedidos</a>
</body>
</html>
