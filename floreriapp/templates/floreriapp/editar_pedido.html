<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fcfbfa;
            color: #2c3531;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-form {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.05);
            width: 100%;
            max-width: 420px;
            border-top: 4px solid #4a6b5d;
            border-bottom: 1px solid #f0ebe5;
        }

        h1 {
            color: #3b5249;
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            color: #5a6b62;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #dcd6cd;
            border-radius: 6px;
            font-size: 14px;
            background-color: #faf9f7;
            color: #2c3531;
            font-family: inherit;
            transition: all 0.25s ease;
        }

        input:focus,
        select:focus {
            border-color: #4a6b5d;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 107, 93, 0.12);
        }

        button[type="submit"] {
            width: 100%;
            background-color: #4a6b5d;
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            background-color: #3b5249;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        a.volver {
            display: block;
            text-align: center;
            color: #6b7c72;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
            font-size: 13px;
            margin-top: 25px;
            transition: color 0.2s ease;
        }

        a.volver:hover {
            color: #3b5249;
            text-decoration: underline;
        }

        #mensaje {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>

    <div class="contenedor-form">
        <h1 id="titulo-editar">Editar Pedido #{{ pedido.id }}</h1>

        <form id="formEditarPedido">
            <div class="campo-grupo">
                <label for="cliente">Cliente:</label>
                <select id="cliente" name="cliente" required>
                    <option value="">-- Seleccione un cliente --</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}" {% if cliente.id == pedido.cliente.id %}selected{% endif %}>
                            {{ cliente.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo-grupo">
                <label for="fecha_pedido">Fecha de pedido:</label>
                <input type="date" id="fecha_pedido" name="fecha_pedido" value="{{ pedido.fecha_pedido|date:'Y-m-d' }}" required>
            </div>

            <div class="campo-grupo">
                <label for="direccion_entrega">Dirección de entrega:</label>
                <input type="text" id="direccion_entrega" name="direccion_entrega" value="{{ pedido.direccion_entrega }}" maxlength="150" required>
            </div>

            <div class="campo-grupo">
                <label for="estado">Estado del pedido:</label>
                <select id="estado" name="estado" required>
                    {% for valor, etiqueta in estados %}
                        <option value="{{ valor }}" {% if valor == pedido.estado %}selected{% endif %}>
                            {{ etiqueta }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo-grupo">
                <label for="total">Total ($):</label>
                <input type="number" id="total" name="total" value="{{ pedido.total }}" min="0" max="10000000" required>
            </div>

            <button type="submit">Actualizar pedido</button>
        </form>

        <p id="mensaje"></p>
    </div>

    <a href="{% url 'listar_pedidos' %}" class="volver">Volver a la lista de pedidos</a>

    <script>
        const formulario = document.getElementById('formEditarPedido');
        const mensaje = document.getElementById('mensaje');
        const token = sessionStorage.getItem('token');
        const pedidoId = "{{ pedido.id }}";

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDatosPedido() {
            try {
                const respuesta = await fetch(`/api/pedidos/${pedidoId}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    document.getElementById('cliente').value = datos.cliente_id;
                    document.getElementById('fecha_pedido').value = datos.fecha_pedido;
                    document.getElementById('direccion_entrega').value = datos.direccion_entrega;
                    document.getElementById('estado').value = datos.estado;
                    document.getElementById('total').value = datos.total;
                }
            } catch (error) {}
        }

        cargarDatosPedido();

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            const datosPedido = {
                cliente_id: parseInt(document.getElementById('cliente').value),
                fecha_pedido: document.getElementById('fecha_pedido').value,
                direccion_entrega: document.getElementById('direccion_entrega').value.trim(),
                estado: document.getElementById('estado').value,
                total: parseInt(document.getElementById('total').value)
            };

            mensaje.style.display = 'block';
            mensaje.style.color = '#555';
            mensaje.style.backgroundColor = '#f4f4f4';
            mensaje.textContent = 'Actualizando pedido...';

            try {
                const respuesta = await fetch(`/api/pedidos/${pedidoId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    },
                    body: JSON.stringify(datosPedido)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.style.color = '#1b5e20';
                    mensaje.style.backgroundColor = '#e8f5e9';
                    mensaje.textContent = 'Pedido actualizado correctamente.';
                    
                    setTimeout(() => {
                        window.location.href = "{% url 'listar_pedidos' %}";
                    }, 1200);
                } else {
                    mensaje.style.color = '#c62828';
                    mensaje.style.backgroundColor = '#ffebee';
                    mensaje.textContent = datos.error || 'Error al actualizar el pedido.';
                }
            } catch (error) {
                mensaje.style.color = '#c62828';
                mensaje.style.backgroundColor = '#ffebee';
                mensaje.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
