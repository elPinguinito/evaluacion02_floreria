<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pedidos - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #2e7d32;
        }

        h1 {
            color: #2c5e3b;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
        }

        .btn-crear {
            display: inline-block;
            background-color: #2e7d32;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-crear:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
        }

        th {
            background-color: #2e7d32;
            color: white;
            text-align: left;
            padding: 12px;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #444;
        }

        tr:nth-child(even) {
            background-color: #f9fbf9;
        }

        tr:hover {
            background-color: #f1f8e9;
        }

        .acciones-cell a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            margin: 0 3px;
            transition: color 0.2s ease;
        }

        .acciones-cell a:hover {
            color: #1b5e20;
            text-decoration: underline;
        }

        .acciones-cell a.eliminar {
            color: #c62828;
        }

        .acciones-cell a.eliminar:hover {
            color: #b71c1c;
        }

        .volver-link {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            transition: color 0.2s ease;
        }

        .volver-link:hover {
            color: #1b5e20;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Listado de Pedidos</h1>

        <a href="{% url 'crear_pedido' %}" class="btn-crear"> + Crear nuevo pedido</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-pedidos-body">
                <tr>
                    <td colspan="6" style="text-align: center; color: #777;">Cargando lista de pedidos...</td>
                </tr>
            </tbody>
        </table>

        <a href="{% url 'inicio' %}" class="volver-link">Volver al inicio</a>
    </div>

    <script>
        const token = sessionStorage.getItem('token');

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarPedidos() {
            const tbody = document.getElementById('tabla-pedidos-body');
            const urlDetalleBase = "{% url 'detalle_pedido' 0 %}";
            const urlEditarBase = "{% url 'editar_pedido' 0 %}";
            const urlEliminarBase = "{% url 'eliminar_pedido' 0 %}";

            try {
                const headers = {
                    'Content-Type': 'application/json',
                    'Authorization': 'Token ' + token
                };

                const [respPedidos, respClientes] = await Promise.all([
                    fetch('/api/pedidos/', { headers }),
                    fetch('/api/clientes/', { headers }).catch(() => null)
                ]);

                if (respPedidos.ok) {
                    const pedidos = await respPedidos.json();

                    let mapaClientes = {};
                    if (respClientes && respClientes.ok) {
                        const clientes = await respClientes.json();
                        clientes.forEach(c => mapaClientes[c.id] = c.nombre);
                    }

                    tbody.innerHTML = '';

                    if (pedidos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #777;">No hay pedidos registrados.</td></tr>';
                    } else {
                        pedidos.forEach(pedido => {
                            const tr = document.createElement('tr');

                            const urlDetalle = urlDetalleBase.replace('0', pedido.id);
                            const urlEditar = urlEditarBase.replace('0', pedido.id);
                            const urlEliminar = urlEliminarBase.replace('0', pedido.id);

                            const nombreCliente = mapaClientes[pedido.cliente_id] || `Cliente #${pedido.cliente_id}`;

                            tr.innerHTML = `
                                <td><strong>#${pedido.id}</strong></td>
                                <td>${nombreCliente}</td>
                                <td>${pedido.fecha_pedido}</td>
                                <td>${pedido.estado}</td>
                                <td>$${pedido.total}</td>
                                <td class="acciones-cell">
                                    <a href="${urlDetalle}">Ver detalle</a> |
                                    <a href="${urlEditar}">Editar</a> |
                                    <a href="${urlEliminar}" class="eliminar">Eliminar</a>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #c62828;">Error al cargar la lista de pedidos.</td></tr>';
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #c62828;">Error de conexión con el servidor.</td></tr>';
            }
        }

        cargarPedidos();
    </script>
</body>
</html>
