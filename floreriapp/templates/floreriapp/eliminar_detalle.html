<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Detalle</title>
</head>
<body>
    <h1>¿Estás seguro de eliminar este ítem del pedido?</h1>
    <p>Eliminarás <strong>{{ detalle.cantidad }}x {{ detalle.flor.nombre }}</strong> del <strong>Pedido #{{ detalle.pedido.id }}</strong>.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Sí, eliminar ítem</button>
    </form>

    <br>
    <a href="{% url 'listar_detalles' %}">Cancelar y volver</a>
</body>
</html>
