<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Flor - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fcfbfa;
            color: #2c3531;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-form {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.05);
            width: 100%;
            max-width: 420px;
            border-top: 4px solid #4a6b5d;
            border-bottom: 1px solid #f0ebe5;
        }

        h1 {
            color: #3b5249;
            margin-bottom: 25px;
            font-size: 24px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            color: #5a6b62;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #dcd6cd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background-color: #faf9f7;
            color: #2c3531;
            transition: all 0.25s ease;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus,
        textarea:focus {
            border-color: #4a6b5d;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 107, 93, 0.12);
        }

        .checkbox-grupo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        input[type="checkbox"] {
            accent-color: #4a6b5d;
            transform: scale(1.1);
            cursor: pointer;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #4a6b5d;
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            background-color: #3b5249;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        a.volver {
            display: block;
            text-align: center;
            color: #6b7c72;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
            font-size: 13px;
            margin-top: 25px;
            transition: color 0.2s ease;
        }

        a.volver:hover {
            color: #3b5249;
            text-decoration: underline;
        }

        #mensaje {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>

    <div class="contenedor-form">
        <h1 id="titulo-editar">Editar flor</h1>

        <form id="formEditarFlor">
            <div class="campo-grupo">
                <label for="nombre">Nombre de la flor:</label>
                <input type="text" id="nombre" name="nombre" maxlength="20" value="{{ flor.nombre }}" required>
            </div>

            <div class="campo-grupo">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" maxlength="200" required>{{ flor.descripcion }}</textarea>
            </div>

            <div class="campo-grupo">
                <label for="color">Color:</label>
                <input type="text" id="color" name="color" maxlength="30" value="{{ flor.color }}" required>
            </div>

            <div class="campo-grupo">
                <label for="precio">Precio ($):</label>
                <input type="number" id="precio" name="precio" value="{{ flor.precio }}" min="1" max="10000000" required>
            </div>

            <div class="campo-grupo">
                <label for="stock">Stock disponible:</label>
                <input type="number" id="stock" name="stock" value="{{ flor.stock }}" min="0" max="100000" required>
            </div>

            <div class="checkbox-grupo">
                <input type="checkbox" name="disponible" id="disponible" {% if flor.disponible %}checked{% endif %}>
                <label for="disponible" style="cursor: pointer;">Flor disponible para la venta</label>
            </div>

            <button type="submit">Actualizar flor</button>
        </form>

        <p id="mensaje"></p>
    </div>

    <a href="{% url 'listar_flores' %}" class="volver">Volver a la lista de flores</a>

    <script>
        const formulario = document.getElementById('formEditarFlor');
        const mensaje = document.getElementById('mensaje');
        const token = sessionStorage.getItem('token');
        const florId = "{{ flor.id }}";

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDatosFlor() {
            try {
                const respuesta = await fetch(`/api/flores/${florId}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    const datos = await respuesta.json();
                    document.getElementById('titulo-editar').textContent = 'Editar flor: ' + datos.nombre;
                    document.getElementById('nombre').value = datos.nombre;
                    document.getElementById('descripcion').value = datos.descripcion;
                    document.getElementById('color').value = datos.color;
                    document.getElementById('precio').value = datos.precio;
                    document.getElementById('stock').value = datos.stock;
                    document.getElementById('disponible').checked = datos.disponible;
                }
            } catch (error) {
                console.error('Error al cargar los datos de la flor:', error);
            }
        }

        cargarDatosFlor();

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            const datosFlor = {
                nombre: document.getElementById('nombre').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim(),
                color: document.getElementById('color').value.trim(),
                precio: parseInt(document.getElementById('precio').value),
                stock: parseInt(document.getElementById('stock').value),
                disponible: document.getElementById('disponible').checked
            };

            mensaje.style.display = 'block';
            mensaje.style.color = '#555';
            mensaje.style.backgroundColor = '#f4f4f4';
            mensaje.textContent = 'Actualizando flor...';

            try {
                const respuesta = await fetch(`/api/flores/${florId}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    },
                    body: JSON.stringify(datosFlor)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.style.color = '#1b5e20';
                    mensaje.style.backgroundColor = '#e8f5e9';
                    mensaje.textContent = 'Flor actualizada correctamente.';
                    
                    setTimeout(() => {
                        window.location.href = "{% url 'listar_flores' %}";
                    }, 1200);
                } else {
                    mensaje.style.color = '#c62828';
                    mensaje.style.backgroundColor = '#ffebee';
                    mensaje.textContent = datos.errores ? datos.errores.join(' ') : 'Error al actualizar la flor.';
                }
            } catch (error) {
                mensaje.style.color = '#c62828';
                mensaje.style.backgroundColor = '#ffebee';
                mensaje.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
