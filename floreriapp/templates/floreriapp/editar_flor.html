<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Flor</title>
</head>
<body>
    <h1>Editar flor: {{ flor.nombre }}</h1>

    {% if errores %}
        <ul style="color: red;">
            {% for error in errores %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="nombre">Nombre de la flor:</label><br>
        <input type="text" id="nombre" name="nombre" value="{{ flor.nombre }}" required>

        <br><br>

        <label for="descripcion">Descripción:</label><br>
        <textarea id="descripcion" name="descripcion" required>{{ flor.descripcion }}</textarea>

        <br><br>

        <label for="color">Color:</label><br>
        <input type="text" id="color" name="color" value="{{ flor.color }}" required>

        <br><br>

        <label for="precio">Precio ($):</label><br>
        <input type="number" id="precio" name="precio" value="{{ flor.precio }}" min="1" required>

        <br><br>

        <label for="stock">Stock disponible:</label><br>
        <input type="number" id="stock" name="stock" value="{{ flor.stock }}" min="0" required>

        <br><br>

        <label>
            <input type="checkbox" name="disponible" id="disponible" {% if flor.disponible %}checked{% endif %}>
            Flor disponible para la venta
        </label>

        <br><br>

        <button type="submit">Actualizar flor</button>
    </form>

    <br>
    <a href="{% url 'listar_flores' %}">Volver a la lista de flores</a>
</body>
</html>
