<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Pedido - Florería</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fcfbfa;
            color: #2c3531;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #a34848;
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
            font-weight: 500;
        }

        .card-eliminar {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 53, 49, 0.05);
            width: 100%;
            max-width: 420px;
            border-top: 4px solid #a34848;
            border-bottom: 1px solid #f0ebe5;
            text-align: center;
        }

        p {
            font-size: 15px;
            color: #5a6b62;
            margin-bottom: 25px;
            line-height: 1.5;
            font-family: 'Segoe UI', sans-serif;
        }

        strong {
            color: #3b5249;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #a34848;
            color: white;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        button[type="submit"]:hover {
            background-color: #8b3a3a;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        a {
            color: #6b7c72;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
            font-size: 13px;
            display: inline-block;
            margin-top: 20px;
            transition: color 0.2s ease;
        }

        a:hover {
            color: #3b5249;
            text-decoration: underline;
        }

        #mensaje {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <div class="card-eliminar">
        <h1>¿Estás seguro de eliminar este pedido?</h1>
        <p>Vas a eliminar el <strong id="info-pedido">Pedido #{{ pedido.id }}</strong>.</p>

        <form id="formEliminarPedido">
            <button type="submit">Sí, eliminar definitivamente</button>
        </form>

        <p id="mensaje"></p>

        <a href="{% url 'listar_pedidos' %}">Cancelar y volver</a>
    </div>

    <script>
        const formulario = document.getElementById('formEliminarPedido');
        const mensaje = document.getElementById('mensaje');
        const token = sessionStorage.getItem('token');
        const pedidoId = "{{ pedido.id }}";

        if (!token) {
            window.location.href = "{% url 'login' %}";
        }

        async function cargarDatosPedido() {
            try {
                const respuestaPedido = await fetch(`/api/pedidos/${pedidoId}/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuestaPedido.ok) {
                    const datosPedido = await respuestaPedido.json();
                    let nombreCliente = 'Cliente #' + datosPedido.cliente_id;

                    try {
                        const respuestaCliente = await fetch(`/api/clientes/${datosPedido.cliente_id}/`, {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Token ' + token
                            }
                        });
                        if (respuestaCliente.ok) {
                            const datosCliente = await respuestaCliente.json();
                            nombreCliente = datosCliente.nombre;
                        }
                    } catch (e) {}

                    document.getElementById('info-pedido').textContent = `Pedido #${datosPedido.id} del cliente ${nombreCliente}`;
                }
            } catch (error) {}
        }

        cargarDatosPedido();

        formulario.addEventListener('submit', async function(event) {
            event.preventDefault();

            mensaje.style.display = 'block';
            mensaje.style.color = '#555';
            mensaje.style.backgroundColor = '#f4f4f4';
            mensaje.textContent = 'Eliminando pedido...';

            try {
                const respuesta = await fetch(`/api/pedidos/${pedidoId}/`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Token ' + token
                    }
                });

                if (respuesta.ok) {
                    mensaje.style.color = '#1b5e20';
                    mensaje.style.backgroundColor = '#e8f5e9';
                    mensaje.textContent = 'Pedido eliminado correctamente.';
                    
                    setTimeout(() => {
                        window.location.href = "{% url 'listar_pedidos' %}";
                    }, 1200);
                } else {
                    mensaje.style.color = '#c62828';
                    mensaje.style.backgroundColor = '#ffebee';
                    mensaje.textContent = 'Error al eliminar el pedido.';
                }
            } catch (error) {
                mensaje.style.color = '#c62828';
                mensaje.style.backgroundColor = '#ffebee';
                mensaje.textContent = 'Error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
