<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Pedido</title>
</head>
<body>
    <h1>¿Estás seguro de eliminar este pedido?</h1>
    <p>Vas a eliminar el <strong>Pedido #{{ pedido.id }}</strong> del cliente <strong>{{ pedido.cliente.nombre }}</strong>.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: red;">Sí, eliminar definitivamente</button>
    </form>

    <br>
    <a href="{% url 'listar_pedidos' %}">Cancelar y volver</a>
</body>
</html>
